name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Both languages are compiled for real so CodeQL sees what ships: the Go program and the C kernel module.
jobs:
  analyze:
    name: Analyze (Go, C)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, c-cpp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with: { go-version-file: go.mod }
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
      - name: Build the Go program for CodeQL
        if: matrix.language == 'go'
        run: go build ./...
      - name: Build the kernel module for CodeQL (C)
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq "linux-headers-$(uname -r)"
          cd kernel/truesense-wmi && make KVER="$(uname -r)"
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: { category: "/language:${{ matrix.language }}" }
