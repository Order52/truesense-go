name: Release

# Push a tag (go run ./cmd/release prepare X.Y.Z --title "..." --push does everything) and this publishes the release:
# the verified version, the full Go test suite, one static program built twice and compared, the release bundle (the source tree plus bin/truesense, byte-for-byte
# reproducible), an Arch package, an SBOM, SHA256SUMS, build provenance attestations for every file, and the notes from RELEASE_NOTES.md.
# Run it by hand (Actions, Release, Run workflow): give a tag to re-publish it, or leave the tag empty (dry run on) to rehearse the whole pipeline from main: it builds and checks
# everything and publishes nothing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to (re)publish, e.g. v0.4.0 (empty: rehearse from main)", required: false, default: "" }
      dry_run: { description: "Build and check everything, publish nothing", type: boolean, default: true }

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

# Every action is pinned to a full commit SHA (the comment names the release); Dependabot keeps them current.
jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.TAG }}", fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: The tag, every versioned file and the release notes agree
        id: v
        env: { DRY: "${{ github.event.inputs.dry_run }}" }
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then go run ./cmd/release check --tag "$TAG"
          elif [ "$DRY" = true ]; then echo "rehearsal from $TAG: not a version tag, so no tag check"; go run ./cmd/release check
          else echo "::error::$TAG is not a version tag: only a dry run may build from a branch"; exit 1; fi
          v=$(go run ./cmd/release version); echo "version=$v" >> "$GITHUB_OUTPUT"
          go run ./cmd/release notes "$v" > /dev/null
      - name: The tagged commit is on main (nobody releases a side branch by accident)
        if: startsWith(env.TAG, 'v')
        run: git merge-base --is-ancestor "$TAG" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: go.mod and go.sum are committed (the bundle and the packages are built from them)
        run: git ls-files --error-unmatch go.mod go.sum > /dev/null
      - name: Vet, tests with the race detector, known vulnerabilities
        run: |
          go vet ./...
          go test -race -shuffle=on -count=1 ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 && govulncheck ./...
      - name: The kernel module builds against this runner's kernel
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq "linux-headers-$(uname -r)"
          bash tools/ci/build-modules.sh "$(uname -r)"

  build:
    name: Build the release files
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: The bundle, built twice (the two must be identical, the program inside must run)
        env: { V: "${{ needs.verify.outputs.version }}" }
        run: |
          # static linux/amd64 program (-trimpath, commit and date from git), then git archive of this tree plus bin/truesense with sorted names,
          # the commit's mtime, root owner and gzip -n: see tools/ci/build-bundle.sh
          tools/ci/build-bundle.sh "$V" build/a
          tools/ci/build-bundle.sh "$V" build/b
          tools/ci/check-bundle.sh "$V" build/a build/b
          mkdir dist && cp "build/a/truesense-$V.tar.gz" dist/
          go run ./cmd/release notes "$V" > dist/RELEASE-NOTES.md
      - name: SBOM (CycloneDX) of the program that ships
        env: { V: "${{ needs.verify.outputs.version }}" }
        run: |
          go version -m build/a/truesense
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          cyclonedx-gomod bin -json -noserial -version "$V" -output "dist/truesense-$V.sbom.cdx.json" build/a/truesense
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "dist/truesense-$V.sbom.cdx.json" > /dev/null || { echo "::error::the SBOM is empty or not CycloneDX"; exit 1; }
      - name: Upload for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist-bundle, path: dist, if-no-files-found: error }

  package-arch:
    name: Build the Arch package
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm base-devel git go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.TAG }}" }
      - name: makepkg (unprivileged, builds the program with go)
        run: |
          useradd -m builder; chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f --nodeps --noconfirm"
          mkdir dist && cp packaging/arch/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist-arch, path: dist, if-no-files-found: error }

  publish:
    name: Publish
    needs: [verify, build, package-arch]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # create the release and upload the files
      id-token: write          # build provenance is signed with the workflow's own identity (Sigstore), no keys to manage
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "dist-*", path: dist, merge-multiple: true }
      - name: SHA256SUMS (the bundle, the package and the SBOM)
        run: |
          cd dist && sha256sum truesense-*.tar.gz truesense-*.pkg.tar.zst truesense-*.sbom.cdx.json > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance (who built these files, from which commit, by which workflow)
        if: github.event.inputs.dry_run != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/truesense-*
            dist/SHA256SUMS
      - name: Create or update the GitHub release
        if: github.event.inputs.dry_run != 'true'
        env: { GH_TOKEN: "${{ github.token }}", V: "${{ needs.verify.outputs.version }}" }
        run: |
          title="TrueSense $V: $(grep -m1 "^## $V (" RELEASE_NOTES.md | sed -E 's/^## [^ ]+ \([^)]*\):? ?//')"
          files=(dist/truesense-*.tar.gz dist/truesense-*.pkg.tar.zst dist/truesense-*.sbom.cdx.json dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file dist/RELEASE-NOTES.md --latest
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$title" --notes-file dist/RELEASE-NOTES.md --latest --verify-tag
          fi
      - name: Dry run summary
        if: github.event.inputs.dry_run == 'true'
        run: |
          { echo "### Dry run of $TAG: nothing was published"; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The published release downloads and verifies the way users get it (checksums and provenance)
        if: github.event.inputs.dry_run != 'true'
        env: { GH_TOKEN: "${{ github.token }}", V: "${{ needs.verify.outputs.version }}" }
        run: |
          # the release and its attestations can take a moment to be readable: try a few times before calling it a failure
          for attempt in 1 2 3 4 5; do
            sleep 10
            if TRUESENSE_GET_ONLY=1 TRUESENSE_VERIFY_ATTESTATION=1 TRUESENSE_VERSION="$V" bash tools/get.sh; then exit 0; fi
            echo "attempt $attempt failed"
          done
          echo "::error::tools/get.sh could not verify the published release"; exit 1

  aur:
    name: Publish to the AUR (when configured)
    needs: [publish]
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skipped unless the AUR_SSH_PRIVATE_KEY secret is set
        id: gate
        env: { KEY: "${{ secrets.AUR_SSH_PRIVATE_KEY }}" }
        run: |
          if [ -n "$KEY" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "AUR_SSH_PRIVATE_KEY is not set, skipping (publish by hand with tools/aur-publish.sh)"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.go == '1'
        with: { ref: "${{ env.TAG }}" }
      - name: Push the new PKGBUILD
        if: steps.gate.outputs.go == '1'
        env: { AUR_SSH_PRIVATE_KEY: "${{ secrets.AUR_SSH_PRIVATE_KEY }}" }
        run: |
          install -m 600 -D /dev/stdin ~/.ssh/aur <<< "$AUR_SSH_PRIVATE_KEY"
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" bash tools/aur-publish.sh "${TAG#v}"
